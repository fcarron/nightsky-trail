graphhopper:
  datareader.file: /osm/switzerland-latest.osm.pbf
  graph.location: /graph-cache
  custom_models.directory: /config

  profiles:
    - name: hike
      custom_model_files: [hike.json]
    - name: street
      navigation_mode: foot
      custom_model_files: [street_custom.json]
    - name: racingbike
      navigation_mode: bike
      custom_model_files: [racingbike_custom.json]

  profiles_ch: []
  profiles_lm: []

  graph.encoded_values: |
    country, road_class, roundabout, max_speed, road_environment,
    foot_access, foot_priority, foot_average_speed, foot_road_access,
    hike_rating, foot_network, bike_access, bike_average_speed,
    bike_priority, bike_road_access, bike_network, mtb_rating,
    ferry_speed, smoothness

  prepare.min_network_size: 200
  prepare.subnetworks.threads: 1
  routing.snap_preventions_default: tunnel, bridge, ferry
  routing.non_ch.max_waypoint_distance: 1000000
  import.osm.ignored_highways: ''
  graph.dataaccess.default_type: RAM_STORE

server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: 0.0.0.0
  admin_connectors:
    - type: http
      port: 8990
      bind_host: 0.0.0.0
  request_log:
    appenders: []

logging:
  appenders:
    - type: console
      time_zone: UTC
      log_format: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
