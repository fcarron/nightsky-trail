[project]
name = "swiss-route-planner-backend"
version = "0.1.0"
description = "Backend API for Swiss Route Planner"
requires-python = ">=3.12"
dependencies = [
  "Django==5.2.4",
  "djangorestframework==3.16.0",
  "drf-spectacular==0.28.0",
  "httpx==0.28.1",
  "pyproj==3.7.1",
]

[dependency-groups]
dev = [
  "pytest==8.4.1",
  "pytest-django==4.11.1",
  "ruff==0.12.4",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["planner/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.format]
quote-style = "double"
