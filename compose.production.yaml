name: nightsky-trail

services:
  nightsky_graphhopper:
    image: israelhikingmap/graphhopper@sha256:3e79eb33862028cfc58f9d6c162630b68638d6aad790b5a698c854dbbaa7fe32
    command:
      - --config
      - /config/config.yml
      - --graph-cache
      - /graph-cache-street
    volumes:
      - ./docker/graphhopper:/config:ro
      - ${NIGHTSKY_DATA_DIR:-./data}/osm:/osm:ro
      - ${NIGHTSKY_DATA_DIR:-./data}/graphhopper:/graph-cache-street
    networks:
      - nightsky_app
    restart: unless-stopped

  nightsky_backend:
    image: nightsky-trail-backend:${NIGHTSKY_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    env_file:
      - ${NIGHTSKY_ENV_FILE:-.env.production}
    environment:
      DJANGO_DATABASE_PATH: /data/app/db.sqlite3
      GRAPHHOPPER_BASE_URL: http://nightsky_graphhopper:8989
      OSM_PBF_PATH: /data/osm/switzerland-latest.osm.pbf
      OSM_TRAIL_INDEX_PATH: /data/osm/trails.sqlite3
      SWISSTOPO_TRAILS_ZIP_PATH: /data/swisstopo/swisstlm3d-wanderwege_2056_5728.gpkg.zip
      SWISSTOPO_TRAILS_GPKG_PATH: /data/swisstopo/swisstlm3d-wanderwege_2056_5728.gpkg
    volumes:
      - ${NIGHTSKY_DATA_DIR:-./data}/app:/data/app
      - ${NIGHTSKY_DATA_DIR:-./data}/osm:/data/osm
      - ${NIGHTSKY_DATA_DIR:-./data}/swisstopo:/data/swisstopo
    depends_on:
      nightsky_graphhopper:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; request = urllib.request.Request('http://127.0.0.1:8000/api/v1/health', headers={'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request, timeout=5)"
      interval: 30s
      timeout: 6s
      retries: 5
      start_period: 20s
    networks:
      - nightsky_app
    restart: unless-stopped

  nightsky_gateway:
    image: nightsky-trail-gateway:${NIGHTSKY_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
    depends_on:
      nightsky_backend:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - nightsky_app
      - nightsky_edge
    restart: unless-stopped

networks:
  nightsky_app:
  nightsky_edge:
    external: true
    name: ${NIGHTSKY_EDGE_NETWORK:-bantigerjersey_webnet}
